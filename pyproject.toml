[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tactile-mnist"
dynamic = ["version"]
description = "The Tactile MNIST benchmark suite for active tactile perception."
readme = "README.md"
authors = [
    { name = "Tim Schneider", email = "tim@robot-learning.de" }
]
license = { text = "MIT" }
dependencies = [
    "ap_gym>=0.4.0",
    "filelock",
    "numpy>=1.25",
    "transformation3d>=1.0.1",
    "tqdm",
    "trimesh[easy]",
    "scikit-robot-pyrender",
    "scipy",
    "threadpoolctl",
    "requests",
    "opencv-python",
    "av",
    "objaverse",
    "datasets",
    "cod-vae[hub]"
]

[project.urls]
Homepage = "https://github.com/TimSchneider42/tactile-mnist"

[project.optional-dependencies]
examples = [
    "matplotlib",
    "trimesh[recommend]",
]
torch = [
    "taxim[torch]>=1.4.0",
    "torch",
    "torchvision"
]
jax-cpu = [
    "taxim[jax-cpu]>=1.4.0",
    "jax"
]
jax = [
    "taxim[jax]>=1.4.0",
    "jax[cuda12]"
]

[tool.setuptools.packages.find]
include = ["tactile_mnist*"]

[tool.setuptools.package-data]
tactile_mnist = ["resources/*"]

[tool.setuptools_scm]
# Version is inferred from the latest "v*" git tag; between tags this yields
# development versions like 0.1.1.dev3+g1a2b3c4 (tagged builds are plain X.Y.Z).
version_file = "tactile_mnist/_version.py"
fallback_version = "0.0.0"
version_scheme = "guess-next-dev"
