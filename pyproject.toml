[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tactile-mnist"
version = "0.12.0"
description = "The Tactile MNIST benchmark for active tactile perception."
readme = "README.md"
authors = [
    { name = "REDACTED", email = "REDACTED@REDACTED.REDACTED" }
]
license = { text = "MIT" }
dynamic = ["dependencies"]

[project.urls]
Homepage = "REDACTED"

[project.optional-dependencies]
examples = [
    "matplotlib",
    "trimesh[recommend]",
]
torch = [
    "taxim[torch]>=1.4.0",
    "torch",
    "torchvision"
]
jax-cpu = [
    "taxim[jax-cpu]>=1.4.0",
    "jax"
]
jax = [
    "taxim[jax]>=1.4.0",
    "jax[cuda12]"
]

[tool.setuptools.packages.find]
include = ["tactile_mnist*"]

[tool.setuptools.package-data]
tactile_mnist = ["resources/*"]
